<!doctype html><meta charset="utf-8"><script>
(async () => {
  const names = ['1-reader.png','2-discover.png','3-study.png','4-plans.png','5-dark.png','6-home.png'];
  const target = window.parent !== window ? window.parent : window.opener;
  for (const n of names) {
    const r = await fetch(n); const buf = await r.arrayBuffer();
    target.postMessage({type: 'shot', name: n, buf}, '*', [buf]);
  }
  target.postMessage({type: 'done'}, '*');
})();
</script>
